[package]
name = "pi-rpc"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Bounded asynchronous Tokio JSONL client for Pi 1.1.0"
readme = "README.md"
publish = false
# License undecided. No license grant is made by this manifest.

[features]
default = ["subprocess"]
subprocess = ["tokio/process"]
session_file = []

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "sync", "rt", "macros", "time"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "test-util"] }
tempfile = "3"

[[example]]
name = "local"
required-features = ["subprocess"]

[[example]]
name = "native_session"
required-features = ["session_file"]

[[example]]
name = "release_smoke"
required-features = ["subprocess"]

[[example]]
name = "model_smoke"
required-features = ["subprocess"]

[[example]]
name = "rpc_extension_smoke"
required-features = ["subprocess"]

[[example]]
name = "rpc_state_smoke"
required-features = ["subprocess"]

[[example]]
name = "rpc_live_smoke"
required-features = ["subprocess"]

[[example]]
name = "rpc_session_smoke"
required-features = ["subprocess"]
