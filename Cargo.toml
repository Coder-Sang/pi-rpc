[package]
name = "pi-rpc"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Bounded asynchronous Tokio JSONL client for Pi 1.1.0"
readme = "README.md"
publish = false
license = "Apache-2.0"
repository = "https://github.com/Coder-Sang/pi-rpc"
keywords = ["pi", "rpc", "jsonl", "tokio", "async"]

[features]
default = ["subprocess"]
subprocess = ["tokio/process"]
session_file = []

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["unbounded_depth", "float_roundtrip"] }
serde_stacker = "0.1"
# Newer psm pulls in ar_archive_writer's Rust 1.88 syntax despite missing MSRV metadata.
psm = "=0.1.27"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "sync", "rt", "macros", "time"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "test-util"] }
tempfile = "3"

[package.metadata.docs.rs]
all-features = true

[[example]]
name = "local"
required-features = ["subprocess"]

[[example]]
name = "native_session"
required-features = ["session_file"]

[[example]]
name = "session_builder_bench"
required-features = ["session_file"]

[[example]]
name = "release_smoke"
required-features = ["subprocess"]

[[example]]
name = "model_smoke"
required-features = ["subprocess"]

[[example]]
name = "rpc_extension_smoke"
required-features = ["subprocess"]

[[example]]
name = "rpc_state_smoke"
required-features = ["subprocess"]

[[example]]
name = "rpc_live_smoke"
required-features = ["subprocess"]

[[example]]
name = "rpc_session_smoke"
required-features = ["subprocess"]

[[example]]
name = "session_validation_bench"
required-features = ["session_file"]
