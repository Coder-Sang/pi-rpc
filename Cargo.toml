[package]
name = "pi-rpc"
version = "0.3.3-bolt.2"
edition = "2024"
rust-version = "1.88"
description = "Bounded asynchronous Tokio JSONL client with typed protocols for Pi 1.3.0 through 1.5.2"
readme = "README.md"
publish = false
license = "Apache-2.0"
repository = "https://github.com/Coder-Sang/pi-rpc"
keywords = ["pi", "rpc", "jsonl", "tokio", "async"]
categories = ["asynchronous", "api-bindings"]
exclude = ["/.github/"]

[features]
default = ["subprocess", "pi_1_4", "pi_1_5"]
subprocess = ["tokio/process"]
session_file = []
pi_1_3 = []
pi_1_4 = []
pi_1_5 = []
bolt_message_id = ["pi_1_5"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["unbounded_depth", "float_roundtrip"] }
serde_stacker = "0.1"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "sync", "rt", "macros", "time"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "test-util"] }
tempfile = "3"

[package.metadata.docs.rs]
all-features = true

[[example]]
name = "local"
required-features = ["subprocess"]

[[example]]
name = "native_session"
required-features = ["session_file"]

[[example]]
name = "session_builder_bench"
required-features = ["session_file"]

[[example]]
name = "release_smoke"
required-features = ["subprocess"]
test = true

[[example]]
name = "model_smoke"
required-features = ["subprocess", "pi_1_5"]
test = true

[[example]]
name = "rpc_extension_smoke"
required-features = ["subprocess", "pi_1_5"]

[[example]]
name = "rpc_state_smoke"
required-features = ["subprocess", "pi_1_5"]

[[example]]
name = "rpc_live_smoke"
required-features = ["subprocess", "pi_1_5"]

[[example]]
name = "rpc_session_smoke"
required-features = ["subprocess", "pi_1_5"]

[[example]]
name = "session_validation_bench"
required-features = ["session_file"]

[[example]]
name = "injected"
required-features = ["pi_1_4"]

[[example]]
name = "bolt_message_id"
required-features = ["bolt_message_id"]

[[example]]
name = "protocol_bench"
required-features = ["pi_1_4", "session_file"]
